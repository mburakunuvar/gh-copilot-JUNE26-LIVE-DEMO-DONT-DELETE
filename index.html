<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to GH Copilot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .container {
      width: min(860px, 100%);
      background: #11161d;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2.4rem;
      color: #58a6ff;
      margin-bottom: 0.75rem;
    }
    .subtitle {
      font-size: 1.15rem;
      color: #8b949e;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    nav a {
      display: block;
      padding: 1rem 1.5rem;
      background: #21262d;
      color: #58a6ff;
      text-decoration: none;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: background 0.2s, border-color 0.2s;
    }
    nav a:hover, nav a:focus {
      background: #30363d;
      border-color: #58a6ff;
      outline: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Welcome to the World of GH Copilot</h1>
    <p class="subtitle">Explore GitHub Copilot across multiple modes — IDE, Web UI, CLI, SDK, and App.</p>
    <nav>
      <a href="gh-copilot-vscode.html">GH Copilot in VS Code</a>
      <a href="gh-copilot-web-ui.html">GH Copilot in Web UI</a>
      <a href="gh-copilot-cli.html">GH Copilot CLI</a>
      <a href="gh-copilot-sdk.html">GH Copilot SDK</a>
      <a href="gh-copilot-app.html">GH Copilot App</a>
    </nav>
  </main>
</body>
</html>
